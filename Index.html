<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldCore</title>

  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      color: #38bdf8;
    }

    button {
      background: #38bdf8;
      color: #101827;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🌐 WorldCore</h1>
  <p>Your Web3 Trading & NFT Platform</p>

  <button id="nftButton">Create NFT</button>

  <p id="message">Welcome to WorldCore!</p>

  <script>
    const button = document.getElementById("nftButton");
    const message = document.getElementById("message");

    button.addEventListener("click", function () {
      message.textContent =
        "Your NFT creation journey starts here!";
    });
  </script>
</body>
</html>
